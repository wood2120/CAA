<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html
    
    # Configuración de directorio
    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Configuración para archivos PHP
        DirectoryIndex index.php index.html
        
        # Configuración de reescritura
        RewriteEngine On
        
        # Redireccionar a index.php si el archivo no existe
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>
    
    # Configuración para archivos estáticos (solo si mod_expires está disponible)
    <IfModule mod_expires.c>
        <Directory /var/www/html/assets>
            ExpiresActive On
            ExpiresByType text/css "access plus 1 month"
            ExpiresByType application/javascript "access plus 1 month"
            ExpiresByType image/png "access plus 1 month"
            ExpiresByType image/jpg "access plus 1 month"
            ExpiresByType image/jpeg "access plus 1 month"
            ExpiresByType image/gif "access plus 1 month"
        </Directory>
    </IfModule>
    
    # Headers de seguridad (solo si mod_headers está disponible)
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options nosniff
        Header always set X-Frame-Options DENY
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>
    
    # Logs
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    # Configuración de seguridad básica
    ServerTokens Prod
    ServerSignature Off
    
    # Configuración para archivos sensibles
    <Files ".env*">
        Require all denied
    </Files>
    
    <Files "*.sql">
        Require all denied
    </Files>
    
    <Files "composer.*">
        Require all denied
    </Files>
    
    <Files "*.md">
        Require all denied
    </Files>
</VirtualHost>
